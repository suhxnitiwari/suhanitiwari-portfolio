<!doctype html>
<!-- The CrowdStrike deck's cover video, as a page: red binary falls, the five forces light up around rivalry and their
     threat meters fill, a "Microsoft" tag lands on four of them, then the screen glitches on July 2024 and fades to loop.
     window.render(t) draws the frame at t seconds, so record.mjs can step through it frame by frame.
     The left side stays dark and quiet for the slide's headline. -->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0B0809; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, DUR = 9;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = x => Math.min(1, Math.max(0, x));
const win = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// a fixed pseudo-random number for a pair of integers, so every frame is the same on every run
const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

// the forces, around rivalry in the middle of the right half
const CX = 930, CY = 360;
const forces = [
    { name: 'NEW ENTRANTS', lvl: 'MODERATE', bars: 2, x: CX, y: 128, ms: false },
    { name: 'SUPPLIERS', lvl: 'MODERATE', bars: 2, x: 700, y: CY, ms: true },
    { name: 'BUYERS', lvl: 'MODERATE', bars: 2, x: 1160, y: CY, ms: true },
    { name: 'SUBSTITUTES', lvl: 'MODERATE', bars: 2, x: CX, y: 592, ms: true }
];
const rival = { name: 'RIVALRY', lvl: 'HIGH', bars: 3, x: CX, y: CY, ms: true };

function rain(t) {
    ctx.font = '600 16px ui-monospace, Menlo, monospace';
    const cols = Math.ceil(W / 22);
    for (let i = 0; i < cols; i++) {
        const speed = 70 + rnd(i, 1) * 120, off = rnd(i, 2) * H * 2, len = 8 + Math.floor(rnd(i, 3) * 14);
        const head = ((off + t * speed) % (H + len * 20)) - len * 20 + 40;
        // dimmer on the left, where the headline sits
        const side = 0.25 + 0.75 * clamp((i * 22 - 380) / 500);
        for (let k = 0; k < len; k++) {
            const y = head - k * 20; if (y < -20 || y > H + 20) continue;
            const row = Math.floor((y + t * 0) / 20);
            const ch = rnd(i * 31 + row, Math.floor(t * 6) + k) < 0.5 ? '0' : '1';
            const a = (k === 0 ? 0.9 : 0.5 * (1 - k / len)) * side;
            ctx.fillStyle = k === 0 ? `rgba(255, 120, 120, ${a})` : `rgba(200, 22, 29, ${a})`;
            ctx.fillText(ch, i * 22, y);
        }
    }
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function node(f, t, start, big) {
    const p = back(win(t, start, start + 0.5));
    if (p <= 0) return;
    const w = big ? 230 : 190, h = big ? 112 : 92;
    ctx.save();
    ctx.translate(f.x, f.y); ctx.scale(0.6 + 0.4 * p, 0.6 + 0.4 * p); ctx.globalAlpha = clamp(p);
    ctx.shadowColor = big ? 'rgba(224, 38, 46, 0.7)' : 'rgba(0, 0, 0, 0.6)'; ctx.shadowBlur = big ? 40 : 20;
    rr(-w / 2, -h / 2, w, h, 16); ctx.fillStyle = big ? '#C8161D' : '#17100F'; ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = big ? '#FF4D4D' : 'rgba(255, 77, 77, 0.55)'; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF'; ctx.font = `800 ${big ? 22 : 17}px system-ui, -apple-system, sans-serif`;
    ctx.fillText(f.name, 0, big ? -18 : -14);
    ctx.fillStyle = big ? '#FFFFFF' : '#FFB3B3'; ctx.font = '700 12px system-ui, sans-serif';
    ctx.fillText(f.lvl, 0, big ? 4 : 6);
    // the meter fills after the node lands
    const fill = easeOut(win(t, 2.4 + (big ? 0.6 : 0), 3.6 + (big ? 0.6 : 0)));
    for (let b = 0; b < 3; b++) {
        const bx = -48 + b * 34, by = big ? 22 : 20;
        rr(bx, by, 28, 7, 3.5); ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; ctx.fill();
        if (b < f.bars) { const g = clamp(fill * 3 - b); if (g > 0) { rr(bx, by, 28 * g, 7, 3.5); ctx.fillStyle = big ? '#FFFFFF' : '#FF4D4D'; ctx.fill(); } }
    }
    ctx.restore();
}

function msTag(f, t, start) {
    const p = back(win(t, start, start + 0.35));
    if (p <= 0) return;
    const x = f.x, y = f.y - (f === rival ? 76 : 66);
    ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
    rr(-62, -15, 124, 30, 15); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.fillStyle = '#C8161D'; ctx.font = '800 14px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MICROSOFT', 0, 1); ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

window.render = t => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // the glitch at 6.9 to 7.7 shakes the frame and splits it
    const g = win(t, 6.9, 7.0) * (1 - win(t, 7.55, 7.75));
    const shake = g ? (rnd(Math.floor(t * 30), 9) - 0.5) * 18 * g : 0;
    ctx.fillStyle = '#0B0809'; ctx.fillRect(0, 0, W, H);
    // a red glow behind the forces
    const glow = ctx.createRadialGradient(CX, CY, 20, CX, CY, 420);
    glow.addColorStop(0, `rgba(224, 38, 46, ${0.22 * win(t, 0.6, 2)})`); glow.addColorStop(1, 'rgba(224, 38, 46, 0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    rain(t);
    ctx.translate(shake, 0);

    // lines from each force into rivalry, drawn in
    forces.forEach((f, i) => {
        const p = easeOut(win(t, 0.9 + i * 0.15, 1.6 + i * 0.15));
        if (!p) return;
        ctx.strokeStyle = 'rgba(255, 77, 77, 0.55)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 30;
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + (CX - f.x) * p, f.y + (CY - f.y) * p); ctx.stroke(); ctx.setLineDash([]);
    });
    forces.forEach((f, i) => node(f, t, 0.5 + i * 0.18, false));
    node(rival, t, 1.4, true);

    // Microsoft lands on four of the five
    [forces[1], rival, forces[2], forces[3]].forEach((f, i) => msTag(f, t, 4.6 + i * 0.35));

    // the glitch: a red split and the July 2024 line
    if (g) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        for (let s = 0; s < 7; s++) {
            const y = rnd(s, Math.floor(t * 24)) * H, h = 6 + rnd(s, 3) * 30, dx = (rnd(s, 5) - 0.5) * 80 * g;
            ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
        }
        ctx.fillStyle = `rgba(224, 38, 46, ${0.18 * g})`; ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = g;
        rr(CX - 300, CY - 34, 600, 60, 10); ctx.fillStyle = '#0B0809'; ctx.fill(); ctx.strokeStyle = '#FF4D4D'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#FFFFFF'; ctx.font = '800 36px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
        ctx.fillText('JULY 2024: 8M+ PCS DOWN', CX + (rnd(1, Math.floor(t * 30)) - 0.5) * 10, CY + 8);
        ctx.globalAlpha = 1;
    }

    // fade in from black and back out, so the loop is seamless
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const veil = Math.max(1 - win(t, 0, 0.4), win(t, DUR - 0.9, DUR));
    if (veil) { ctx.fillStyle = `rgba(11, 8, 9, ${veil})`; ctx.fillRect(0, 0, W, H); }
};
window.DUR = DUR;
window.ready = document.fonts.ready;
render(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 6.0);
</script>
</body>
</html>
