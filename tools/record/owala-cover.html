<!doctype html>
<!-- The Owala deck's cover video, as a page: a race clock runs to a finish time, the tape breaks, the Austin bottle
     is engraved with the runner's name and time, then it joins a shelf that fills with all eight race cities.
     window.render(t) draws the frame at t seconds, so record.mjs can step through it frame by frame.
     The left side stays quiet for the slide's headline; only the stat in the bottom corner moves there. -->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body { position: relative; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 92% 6%, #F7DDE2 0, rgba(247, 221, 226, 0) 38%), radial-gradient(circle at 4% 100%, #FBE9E3 0, rgba(251, 233, 227, 0) 36%), #FFFCFB; }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
    .b1 { width: 420px; height: 420px; left: 640px; top: 300px; background: #F4B9A6; }
    .b2 { width: 360px; height: 360px; left: 960px; top: -80px; background: #F2C3D1; }
    .b3 { width: 300px; height: 300px; left: -60px; top: 480px; background: #F7D3C4; }
    .abs { position: absolute; }

    /* finish arch */
    #arch { left: 610px; top: 120px; width: 560px; height: 470px; }
    .post { position: absolute; top: 0; bottom: 0; width: 26px; border-radius: 13px; background: linear-gradient(#C8553D, #A8442F); box-shadow: 0 18px 30px -18px rgba(42, 24, 16, 0.6); }
    .post.l { left: 0; } .post.r { right: 0; }
    .banner { position: absolute; left: -14px; right: -14px; top: 0; height: 132px; border-radius: 18px; background: #76344E; color: #FFF8F6;
        box-shadow: 0 24px 40px -24px rgba(42, 24, 16, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .banner small { font-size: 15px; font-weight: 800; letter-spacing: 0.32em; }
    .clock { font: 600 62px/1 "SF Mono", Menlo, monospace; letter-spacing: 0.04em; color: #FFD7C9; font-variant-numeric: tabular-nums; }
    .tape { position: absolute; top: 352px; height: 10px; width: 50%; background: repeating-linear-gradient(90deg, #C8553D 0 22px, #FFF8F6 22px 44px); box-shadow: 0 6px 10px -6px rgba(42, 24, 16, 0.5); }
    .tape.l { left: 26px; transform-origin: 0 50%; } .tape.r { right: 26px; transform-origin: 100% 50%; }
    .road { position: absolute; left: -80px; right: -80px; bottom: -6px; height: 6px; border-radius: 3px; background: rgba(118, 52, 78, 0.18); }

    .conf { position: absolute; width: 9px; height: 14px; border-radius: 2px; }

    /* bottles */
    .bottle { position: absolute; width: 150px; height: 562px; transform-origin: 50% 100%; filter: drop-shadow(0 18px 18px rgba(42, 24, 16, 0.28)); }
    .bottle img { display: block; width: 100%; height: 100%; }
    .eng { position: absolute; left: 0; right: 0; text-align: center; color: #FFFFFF; text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4); white-space: nowrap; }
    .eng.name { top: 43.4%; font: 700 21px/1 Georgia, serif; letter-spacing: 0.08em; }
    .eng.time { top: 47.6%; font: 700 12px/1 -apple-system, sans-serif; letter-spacing: 0.24em; }
    .eng span { display: inline-block; }
    .shine { position: absolute; inset: 0; overflow: hidden; mix-blend-mode: screen; -webkit-mask: url(../../wwwroot/images/projects/owala/bottles/austin.webp) 0 0 / 100% 100%; mask: url(../../wwwroot/images/projects/owala/bottles/austin.webp) 0 0 / 100% 100%; }
    .shine i { position: absolute; top: -10%; bottom: -10%; width: 40%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)); transform: skewX(-18deg); }
    .check { position: absolute; left: 50%; top: -14px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #76344E; color: #FFF8F6; font: 700 14px/26px sans-serif; text-align: center; }
    #shelf { left: 540px; top: 612px; width: 680px; height: 12px; border-radius: 6px; background: linear-gradient(#E8C9BE, #D7AE9F); box-shadow: 0 14px 20px -12px rgba(42, 24, 16, 0.45); }

    /* the stat in the bottom-left corner, the same treatment as the Glossier cover */
    #stat { left: 64px; bottom: 58px; }
    #stat small { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #7A665F; margin-bottom: 10px; }
    #stat b { display: block; font: 700 76px/1 Georgia, serif; color: #1E100A; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    #stat b em { font-style: italic; font-weight: 400; color: #C8553D; font-size: 0.55em; letter-spacing: 0; }
    .dots { position: absolute; left: 64px; bottom: 34px; display: flex; gap: 8px; }
    .dots i { width: 22px; height: 6px; border-radius: 3px; background: rgba(118, 52, 78, 0.16); }
    .dots i.on { background: #C8553D; }
    #veil { inset: 0; background: #FFFCFB; pointer-events: none; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="arch" class="abs">
    <div class="post l"></div><div class="post r"></div>
    <div class="banner"><small>FINISH · AUSTIN MARATHON</small><div class="clock" id="clock">0:00:00</div></div>
    <div class="tape l" id="tapeL"></div><div class="tape r" id="tapeR"></div>
    <div class="road"></div>
</div>
<div id="confetti"></div>
<div id="shelf" class="abs"></div>
<div id="bottles"></div>

<div id="stat" class="abs"><small id="statLabel">Mile</small><b id="statValue">0.0</b></div>
<div class="dots" id="dots"></div>
<div id="veil" class="abs"></div>

<script>
const IMG = '../../wwwroot/images/projects/owala/bottles/';
const cities = ['austin', 'nyc', 'boston', 'sf', 'neworleans', 'seattle', 'miami', 'lasvegas'];
const RUNNER = 'SUHANI', TIME = [4, 12, 36];
const FINISH = TIME[0] * 3600 + TIME[1] * 60 + TIME[2];
const $ = id => document.getElementById(id);

// helpers: clamp, map a time window to 0..1, and easing
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const win = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const hms = s => `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(Math.floor(s) % 60).padStart(2, '0')}`;

// bottles: the hero (Austin, engraved) is index 0 and later lands in shelf slot 0
const SLOT_W = 85, SHELF_X = 540, SHELF_Y = 612, SMALL = 0.5;
const bottles = cities.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'bottle';
    el.innerHTML = `<img src="${IMG + c}.webp" alt="">` + (i === 0
        ? `<div class="eng name">${[...RUNNER].map(ch => `<span>${ch}</span>`).join('')}</div><div class="eng time">${hms(FINISH)}</div><div class="shine"><i></i></div>`
        : '') + `<div class="check">✓</div>`;
    $('bottles').appendChild(el);
    return el;
});
for (let i = 0; i < 8; i++) $('dots').appendChild(document.createElement('i'));

// confetti: fixed seeds so every render of the same t looks the same
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const colors = ['#C8553D', '#76344E', '#F4B9A6', '#E9A6BC', '#FFB38A'];
const bits = Array.from({ length: 70 }, () => ({ a: rnd() * Math.PI * 2, v: 260 + rnd() * 420, spin: (rnd() - 0.5) * 1400, c: colors[Math.floor(rnd() * colors.length)], w: rnd() }));
const confEls = bits.map(b => { const d = document.createElement('div'); d.className = 'conf'; d.style.background = b.c; d.style.width = (6 + b.w * 6) + 'px'; $('confetti').appendChild(d); return d; });

const slotX = i => SHELF_X + 20 + i * SLOT_W;   // left edge of a small bottle
const DUR = 12;

window.render = t => {
    // A. the arch fades in and the race clock runs to the finish time (0.2s to 3.4s)
    const archIn = easeOut(win(t, 0, 0.5)), archOut = easeInOut(win(t, 4.3, 5.0));
    const run = easeInOut(win(t, 0.3, 3.4));
    $('arch').style.opacity = archIn * (1 - archOut);
    $('arch').style.transform = `translateY(${(1 - archIn) * 20 - archOut * 60}px)`;
    $('clock').textContent = hms(run * FINISH);

    // B. the tape breaks at 3.5s
    const snap = easeOut(win(t, 3.5, 4.1));
    $('tapeL').style.transform = `rotate(${snap * 64}deg) scaleX(${1 - snap * 0.25})`;
    $('tapeR').style.transform = `rotate(${-snap * 64}deg) scaleX(${1 - snap * 0.25})`;

    // confetti bursts from the tape's middle, falls with gravity, fades out by 5.4s
    const ct = t - 3.5;
    confEls.forEach((d, i) => {
        const b = bits[i];
        if (ct < 0 || ct > 2.2) { d.style.opacity = 0; return; }
        const x = 890 + Math.cos(b.a) * b.v * ct, y = 480 + Math.sin(b.a) * b.v * ct * 0.8 - 300 * ct + 520 * ct * ct;
        d.style.opacity = 1 - win(ct, 1.4, 2.2);
        d.style.transform = `translate(${x}px, ${y}px) rotate(${b.spin * ct}deg)`;
    });

    // C. the Austin bottle rises to centre (4.4s to 5.4s), then the name and time engrave letter by letter
    const rise = back(win(t, 4.4, 5.4));
    const shrink = easeInOut(win(t, 7.2, 8.1));
    const heroX = 825, heroY = 70;
    const sx = slotX(0) - 150 * (1 - SMALL) / 2, sy = SHELF_Y - 562;   // where the small bottle sits (scaled from its bottom centre)
    const hx = heroX + (sx - heroX) * shrink, hy = heroY + (1 - rise) * 640 + (sy - heroY) * shrink;
    const hs = 1 - (1 - SMALL) * shrink;
    bottles[0].style.opacity = win(t, 4.4, 4.7);
    bottles[0].style.transform = `translate(${hx}px, ${hy}px) scale(${hs})`;
    const letters = bottles[0].querySelectorAll('.eng.name span');
    letters.forEach((s, i) => { const p = win(t, 5.5 + i * 0.12, 5.7 + i * 0.12); s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 4}px)`; });
    const tp = win(t, 6.3, 6.6);
    bottles[0].querySelector('.eng.time').style.opacity = tp;
    bottles[0].querySelector('.shine i').style.left = `${-50 + win(t, 6.5, 7.1) * 160}%`;

    // D. the shelf appears and the other seven cities pop in, one every 0.3s
    $('shelf').style.opacity = easeOut(win(t, 7.4, 7.9));
    $('shelf').style.transform = `scaleX(${0.6 + 0.4 * easeOut(win(t, 7.4, 7.9))})`;
    let collected = t >= 7.2 ? 1 : 0;
    bottles.forEach((el, i) => {
        if (i === 0) { el.querySelector('.check').style.opacity = win(t, 8.0, 8.2); return; }
        const a = 8.1 + (i - 1) * 0.3, p = back(win(t, a, a + 0.45));
        if (t >= a + 0.2) collected++;
        el.style.opacity = win(t, a, a + 0.15);
        el.style.transform = `translate(${slotX(i) - 150 * (1 - SMALL) / 2}px, ${sy + (1 - p) * 40}px) scale(${SMALL * (0.7 + 0.3 * p)})`;
        el.querySelector('.check').style.opacity = win(t, a + 0.3, a + 0.45);
    });
    // a gentle bob along the shelf while it holds
    if (t > 10.3) bottles.forEach((el, i) => { const bob = Math.sin((t - 10.3) * 4 - i * 0.7) * 3 * win(t, 10.3, 10.7); el.style.marginTop = bob + 'px'; });
    else bottles.forEach(el => el.style.marginTop = '0px');

    // the corner stat follows the story: mile, then the engraving, then the collection
    const dots = $('dots').children;
    if (t < 4.4) {
        $('statLabel').textContent = 'Mile';
        $('statValue').innerHTML = (run * 26.2).toFixed(1);
    } else if (t < 7.6) {
        $('statLabel').textContent = 'Engraved at the finish';
        $('statValue').innerHTML = hms(FINISH);
    } else {
        $('statLabel').textContent = 'Race cities collected';
        $('statValue').innerHTML = `${collected} <em>of 8</em>`;
    }
    [...dots].forEach((d, i) => d.classList.toggle('on', t >= 7.6 && i < collected));
    const swap = t < 4.4 ? 0 : Math.max(win(t, 4.4, 4.7) < 1 ? 1 - win(t, 4.4, 4.7) : 0, win(t, 7.6, 7.9) < 1 && t >= 7.6 ? 1 - win(t, 7.6, 7.9) : 0);
    $('stat').style.opacity = 1 - swap * 0.9;
    $('dots').style.opacity = win(t, 7.6, 7.9);

    // E. hold, then fade back to the empty frame so the loop is seamless
    $('veil').style.opacity = Math.max(1 - win(t, 0, 0.25), win(t, DUR - 0.6, DUR));
};
window.DUR = DUR;
window.ready = Promise.all([...document.images].map(i => i.decode().catch(() => {})));
render(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 9.5);
</script>
</body>
</html>
