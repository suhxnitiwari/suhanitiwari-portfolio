<!doctype html>
<!-- The Wendy's deck's cover video, as a page: a Dave's Single falls into place one layer at a time, bottom bun to top bun,
     around a square patty whose corners hang over the bun (the cheese melts once it lands). It holds with a gentle bob,
     then fades back to the empty frame so it loops. Illustrations I drew, not product photos or ad footage.
     window.render(t) draws the frame at t seconds, so record.mjs can step through it frame by frame.
     The left side stays plain blush for the slide's headline. -->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #FCEFEF; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, DUR = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = x => Math.min(1, Math.max(0, x));
const win = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

const CX = 960, CY = 380, S = 1.62;   // the burger's center and scale (burger units are about 320 wide)
const B = 0.5;                         // when the burger starts building

function lin(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }

// each layer drops in from above with a little bounce; the patty lands with a squash
function drop(t, at, draw, squash) {
    const k = win(t, at, at + 0.5); if (k <= 0) return;
    const p = back(k), y = (1 - p) * -330;
    const s = squash ? 1 + 0.08 * Math.sin(win(t, at + 0.32, at + 0.62) * Math.PI) : 1;
    ctx.save(); ctx.globalAlpha = clamp(k * 3); ctx.translate(0, y); ctx.scale(1 + (s - 1) * 0.6, 2 - s); draw(); ctx.restore();
}

// ===== the answer: a Dave's Single around a square patty =====
const bottomBun = () => {
    ctx.fillStyle = lin(64, 122, [[0, '#F4BE72'], [0.35, '#E59A45'], [1, '#C9762E']]);
    ctx.beginPath(); ctx.moveTo(-134, 70); ctx.lineTo(134, 70); ctx.quadraticCurveTo(140, 70, 138, 84); ctx.quadraticCurveTo(130, 122, 96, 122); ctx.lineTo(-96, 122); ctx.quadraticCurveTo(-130, 122, -138, 84); ctx.quadraticCurveTo(-140, 70, -134, 70); ctx.fill();
    ctx.fillStyle = 'rgba(255, 236, 200, 0.55)'; ctx.fillRect(-128, 70, 256, 5);
};
// flat ends with square corners that stick out past the bun on both sides, its top face showing
const patty = () => {
    ctx.fillStyle = '#4A2614';
    ctx.beginPath(); ctx.moveTo(-160, 40); ctx.lineTo(-146, 30); ctx.lineTo(146, 30); ctx.lineTo(160, 40); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lin(40, 76, [[0, '#6A3720'], [0.5, '#4E2815'], [1, '#33190C']]);
    ctx.beginPath(); ctx.moveTo(-160, 40); ctx.lineTo(160, 40); ctx.lineTo(158, 74); ctx.lineTo(-158, 74); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 140; i++) {
        const x = -154 + rnd(i, 1) * 308, y = 33 + rnd(i, 2) * 40;
        ctx.fillStyle = rnd(i, 3) < 0.5 ? 'rgba(140, 78, 44, 0.55)' : 'rgba(24, 10, 4, 0.5)';
        ctx.beginPath(); ctx.ellipse(x, y, 1.5 + rnd(i, 4) * 3.5, 1 + rnd(i, 5) * 1.6, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 210, 160, 0.18)'; ctx.fillRect(-150, 42, 300, 3);
};
const cheese = (melt) => {
    ctx.fillStyle = '#F8B21C';
    ctx.fillRect(-150, 34, 300, 8);
    [[-118, 26], [-60, 16], [-10, 30], [44, 20], [104, 28]].forEach(([x, len]) => {
        const l = 6 + len * melt;
        ctx.beginPath(); ctx.moveTo(x - 16, 41); ctx.lineTo(x + 16, 41); ctx.quadraticCurveTo(x + 6, 41 + l * 0.6, x, 41 + l); ctx.quadraticCurveTo(x - 6, 41 + l * 0.6, x - 16, 41); ctx.fill();
    });
    ctx.fillStyle = 'rgba(255, 236, 160, 0.7)'; ctx.fillRect(-140, 35, 280, 2.5);
    ctx.fillStyle = '#F8B21C'; ctx.beginPath(); ctx.moveTo(150, 34); ctx.lineTo(166, 40); ctx.lineTo(158, 40 + 12 * melt); ctx.lineTo(148, 42); ctx.fill();
};
const lettuce = () => {
    ctx.fillStyle = '#5FA334';
    ctx.beginPath(); ctx.moveTo(-166, 32);
    for (let x = -166; x <= 166; x += 12) ctx.quadraticCurveTo(x + 6, 40 + (rnd(x, 7) * 8), x + 12, 31 + rnd(x, 8) * 4);
    ctx.lineTo(160, 14); ctx.quadraticCurveTo(0, 6, -160, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(190, 235, 140, 0.55)';
    for (let x = -150; x <= 150; x += 26) { ctx.beginPath(); ctx.ellipse(x, 22, 10, 4, 0.4, 0, 7); ctx.fill(); }
};
const tomato = () => {
    ctx.fillStyle = '#D93A2B'; ctx.beginPath(); ctx.roundRect(-112, 2, 226, 16, 8); ctx.fill();
    ctx.fillStyle = '#F2675A'; ctx.beginPath(); ctx.roundRect(-104, 5, 210, 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255, 220, 200, 0.6)'; [-70, -20, 30, 80].forEach(x => { ctx.beginPath(); ctx.ellipse(x, 8, 4, 2, 0, 0, 7); ctx.fill(); });
};
const onion = () => {
    ctx.fillStyle = '#F7F3EA'; ctx.strokeStyle = '#E3D9EE'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-128, -8, 150, 12, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-10, -6, 138, 11, 6); ctx.fill(); ctx.stroke();
};
const pickles = () => {
    [[-58, -12], [36, -14], [96, -11]].forEach(([x, y]) => {
        ctx.fillStyle = '#7E9A3A'; ctx.beginPath(); ctx.ellipse(x, y, 36, 7, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(200, 220, 120, 0.7)'; ctx.lineWidth = 1.5;
        for (let i = -28; i <= 28; i += 8) { ctx.beginPath(); ctx.moveTo(x + i, y - 5); ctx.lineTo(x + i + 2, y + 5); ctx.stroke(); }
    });
};
const sauces = () => {
    ctx.fillStyle = '#FFF8EC'; [[-100, -24, 30], [-20, -25, 24], [70, -24, 34]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.ellipse(x, y, r, 6, 0, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#C1271B'; [[-58, -24, 18], [24, -25, 22], [118, -23, 14]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.ellipse(x, y, r, 5, 0, 0, 7); ctx.fill(); });
};
const topBun = () => {
    ctx.fillStyle = lin(-144, -30, [[0, '#E9A85A'], [0.55, '#D98C3A'], [1, '#C77A2E']]);
    ctx.beginPath(); ctx.moveTo(-140, -32); ctx.bezierCurveTo(-142, -134, 142, -134, 140, -32); ctx.quadraticCurveTo(140, -26, 130, -26); ctx.lineTo(-130, -26); ctx.quadraticCurveTo(-140, -26, -140, -32); ctx.fill();
    const g = ctx.createRadialGradient(-30, -102, 4, -30, -102, 90); g.addColorStop(0, 'rgba(255, 238, 205, 0.75)'); g.addColorStop(1, 'rgba(255, 238, 205, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(-30, -92, 96, 34, -0.1, 0, 7); ctx.fill();
};

window.render = t => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#FCEFEF'; ctx.fillRect(0, 0, W, H);
    let g = ctx.createRadialGradient(1180, 40, 10, 1180, 40, 540); g.addColorStop(0, 'rgba(200, 16, 46, 0.16)'); g.addColorStop(1, 'rgba(200, 16, 46, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // the burger falls into place, one layer at a time, bottom up
    const bob = Math.sin(t * 2.6) * 4 * win(t, B + 5.6, B + 6.2);
    ctx.save(); ctx.translate(CX, CY + bob); ctx.scale(S, S);
    ctx.fillStyle = `rgba(110, 40, 20, ${0.16 * win(t, B + 0.3, B + 0.8)})`; ctx.beginPath(); ctx.ellipse(0, 128, 150, 12, 0, 0, 7); ctx.fill();
    const step = 0.6, melt = easeOut(win(t, B + 1.8, B + 2.8));
    drop(t, B + 0.3, bottomBun);
    drop(t, B + 0.3 + step, patty, true);
    drop(t, B + 0.3 + step * 2, () => cheese(melt));
    drop(t, B + 0.3 + step * 3, lettuce);
    drop(t, B + 0.3 + step * 4, tomato);
    drop(t, B + 0.3 + step * 5, onion);
    drop(t, B + 0.3 + step * 6, pickles);
    drop(t, B + 0.3 + step * 7, sauces);
    drop(t, B + 0.3 + step * 8, topBun);
    ctx.restore();

    // fade in from blush and back out, so the loop is seamless
    const veil = Math.max(1 - win(t, 0, 0.3), win(t, DUR - 0.8, DUR));
    if (veil) { ctx.fillStyle = `rgba(252, 239, 239, ${veil})`; ctx.fillRect(0, 0, W, H); }
};
window.DUR = DUR;
window.ready = document.fonts.ready;
render(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 7.5);
</script>
</body>
</html>
