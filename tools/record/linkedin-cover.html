<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { background: radial-gradient(120% 80% at 20% 0%, #8A4D57 0%, #5A2533 45%, #2A1810 100%); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; color: #FFF8F6; position: relative; }
  .glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(243,201,207,0.3), transparent 65%); right: -260px; bottom: -200px; filter: blur(10px); }
  /* the site on top */
  .win { position: absolute; left: 60px; top: 64px; width: 960px; border-radius: 22px; overflow: hidden; background: #FAF1EF; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.12); opacity: 0; }
  .bar { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #F3E3E0; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #E0A9B1; } .bar i:nth-child(2) { background: #E8C987; } .bar i:nth-child(3) { background: #A9BFA0; }
  .url { margin-left: 18px; flex: 1; height: 28px; border-radius: 99px; background: #FFFBF9; display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 600; color: #733642; }
  video { display: block; width: 960px; height: 750px; object-fit: cover; }
  /* the caption underneath */
  h1 { position: absolute; left: 70px; right: 70px; top: 930px; height: 360px; margin: 0; font-family: Georgia, serif; font-size: 76px; line-height: 1.12; font-weight: 700; letter-spacing: -0.5px; }
  h1 .cap { position: absolute; left: 0; right: 0; top: 0; opacity: 0; text-wrap: balance; }
  h1 em { color: #F3C9CF; }
  h1 .m { color: #F3C9CF; font-style: italic; font-weight: 800; }
  /* the end: the Tower at golden hour; the motto's letters fly into my name */
  .end { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .end img { position: absolute; left: -54px; top: -68px; width: 1188px; height: 1485px; }
  .end .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,24,16,0) 28%, rgba(60,20,20,0.35) 58%, rgba(50,16,20,0.72) 100%), linear-gradient(90deg, rgba(42,24,16,0.4), rgba(42,24,16,0) 62%); }
  .ttl { position: absolute; left: 0; right: 0; bottom: 170px; margin: 0; text-align: center; color: #FFF8F6; opacity: 0; text-shadow: 0 4px 30px rgba(40,10,10,0.45); }
  #motto { bottom: 330px; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 64px; line-height: 1.2; text-transform: uppercase; }
  #motto em { font-style: normal; color: #FFD9DE; }
  #name .nm { margin: 0; font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 86px; text-transform: uppercase; white-space: nowrap; }
  #name .k { margin: 18px 0 0; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 28px; letter-spacing: 5px; text-transform: uppercase; color: #FFE4E1; }
  #name .u { margin: 46px 0 0; font-family: Georgia, serif; font-weight: 700; font-size: 70px; color: #FFD9DE; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="win" id="win">
    <div class="bar"><i></i><i></i><i></i><div class="url">suhanitiwari.com</div></div>
    <video id="v" src="li-site.mp4" muted playsinline preload="auto"></video>
  </div>
  <h1 id="h"></h1>
  <div class="end" id="cta">
    <img src="tower.jpg" alt="">
    <div class="shade"></div>
    <p class="ttl" id="motto">What Starts Here<br><em>Changes the World</em></p>
    <div class="ttl" id="name"><p class="nm">Suhani Tiwari</p><p class="k">MIS at McCombs School of Business</p><p class="u">suhanitiwari.com</p></div>
  </div>
<script>
  // [start, end] in seconds of the site recording (from tools/record's marks)
  const caps = [
    [0.00, 2.65, '“MIS? So… business and <em>computer science</em>?”'],
    [2.65, 3.93, 'Every MIS major has heard it.'],
    [3.93, 5.24, 'Couldn’t be further from the <em>truth</em>.'],
    [5.24, 6.57, 'It’s about…'],
    [6.57, 9.02, 'finding the problem <em>worth solving</em>,'],
    [9.02, 10.34, 'turning <b class="m">information</b> into answers,'],
    [10.34, 18.12, 'designing the <b class="m">systems</b> behind it,'],
    [18.12, 20.39, 'getting people to <em>choose</em> it,'],
    [20.39, 24.58, '<b class="m">managing</b> it as it grows,'],
    [24.58, 25.85, 'and teaching the <em>next generation</em> to build too.'],
    [25.85, 99.00, 'So I <em>built</em> my answer.']
  ];
  const h = document.getElementById('h');
  h.innerHTML = caps.map(c => `<span class="cap">${c[2]}</span>`).join('');
  const capEls = [...h.querySelectorAll('.cap')];
  const v = document.getElementById('v'), win = document.getElementById('win'), cta = document.getElementById('cta');
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const VSTART = 0.3, SKIP = 0.9;   // SKIP: the blank moment while the site reloads
  const VEND = 28.6, CTA = 2.0;     // the recording's last useful second, then the end card
  window.DUR = VSTART + VEND - SKIP + CTA;
  const loaded = el => new Promise(r => { if (el.readyState >= 2) r(); else el.addEventListener('loadeddata', r, { once: true }); });
  const tw = document.querySelector('.end img');
  window.ready = Promise.all([loaded(v), tw.decode(), document.fonts.ready]);
  const seek = (el, time) => new Promise(r => { if (Math.abs(el.currentTime - time) < 0.001) return r(); el.addEventListener('seeked', () => r(), { once: true }); el.currentTime = time; });
  window.render = t => new Promise(resolve => {
    const vtime = Math.max(0, t - VSTART) + SKIP;
    capEls.forEach((el, i) => {
      const [a, b] = caps[i];
      const k = i === 0 ? Math.min(ease(t / 0.35), 1 - ease((vtime - b + 0.12) / 0.2)) : Math.min(ease((vtime - a) / 0.22), 1 - ease((vtime - b + 0.12) / 0.2));
      el.style.opacity = Math.max(0, k);
      el.style.transform = `translateY(${(1 - Math.max(0, Math.min(1, k))) * 12}px)`;
    });
    const kw = ease(t / 0.4); win.style.opacity = kw;
    const ctaT = VSTART + VEND - SKIP, kc = ease((t - ctaT) / 0.3), et = Math.max(0, t - ctaT);
    cta.style.opacity = kc;
    tw.style.transform = `scale(${1 + et * 0.03})`;   // a slow push-in on the Tower
    // the motto, then it blurs and spreads apart as my name sharpens into focus in its place
    const mo = document.getElementById('motto'), nm = document.getElementById('name');
    const xo = ease((et - 0.75) / 0.55), xi = ease((et - 0.85) / 0.55);
    mo.style.opacity = Math.min(ease((et - 0.1) / 0.3), 1 - xo);
    mo.style.filter = `blur(${xo * 14}px)`; mo.style.letterSpacing = `${4 + xo * 18}px`;
    nm.style.opacity = xi; nm.style.filter = `blur(${(1 - xi) * 14}px)`;
    nm.querySelector('.nm').style.letterSpacing = `${6 + (1 - xi) * 22}px`;
    nm.querySelector('.u').style.opacity = ease((et - 1.25) / 0.35);
    if (kc > 0) { win.style.opacity = 1 - kc; h.style.opacity = 1 - kc; }
    seek(v, Math.max(SKIP, Math.min(vtime, v.duration - 0.05))).then(resolve);
  });
</script>
</body></html>
