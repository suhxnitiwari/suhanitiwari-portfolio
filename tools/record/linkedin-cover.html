<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { background: radial-gradient(120% 80% at 20% 0%, #8A4D57 0%, #5A2533 45%, #2A1810 100%); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; color: #FFF8F6; position: relative; }
  .glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(243,201,207,0.3), transparent 65%); right: -260px; bottom: -200px; filter: blur(10px); }
  /* the site on top */
  .win { position: absolute; left: 60px; top: 64px; width: 960px; border-radius: 22px; overflow: hidden; background: #FAF1EF; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.12); opacity: 0; }
  .bar { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #F3E3E0; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #E0A9B1; } .bar i:nth-child(2) { background: #E8C987; } .bar i:nth-child(3) { background: #A9BFA0; }
  .url { margin-left: 18px; flex: 1; height: 28px; border-radius: 99px; background: #FFFBF9; display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 600; color: #733642; }
  video { display: block; width: 960px; height: 750px; object-fit: cover; }
  /* the caption underneath */
  h1 { position: absolute; left: 70px; right: 70px; top: 930px; height: 360px; margin: 0; font-family: Georgia, serif; font-size: 76px; line-height: 1.12; font-weight: 700; letter-spacing: -0.5px; }
  h1 .cap { position: absolute; left: 0; right: 0; top: 0; opacity: 0; text-wrap: balance; }
  h1 em { color: #F3C9CF; }
  h1 .m { color: #F3C9CF; font-style: italic; font-weight: 800; }
  /* the end: the Tower at golden hour; the motto's letters fly into my name */
  .end { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .end img { position: absolute; left: -54px; top: -68px; width: 1188px; height: 1485px; }
  .end .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,24,16,0) 28%, rgba(60,20,20,0.35) 58%, rgba(50,16,20,0.72) 100%), linear-gradient(90deg, rgba(42,24,16,0.4), rgba(42,24,16,0) 62%); }
  .end .shade { background: linear-gradient(90deg, rgba(36,10,20,0.62) 0%, rgba(36,10,20,0.25) 55%, rgba(36,10,20,0) 80%), linear-gradient(180deg, rgba(36,10,20,0) 40%, rgba(36,10,20,0.6) 100%) !important; }
  .big { position: absolute; left: 64px; right: 40px; top: 380px; margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 136px; line-height: 1.02; letter-spacing: -4px; color: #FFF8F6; white-space: pre; text-shadow: 0 6px 40px rgba(30,8,16,0.55); }
  .big .pk { color: #F7B8C9; }
  .big.name { top: 420px; font-size: 200px; letter-spacing: -6px; line-height: 0.98; }
  .mis3 { position: absolute; left: 68px; top: 850px; margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 50px; letter-spacing: -1px; color: #F7B8C9; white-space: pre; text-shadow: 0 4px 24px rgba(30,8,16,0.6); }
  .mis3 span { display: inline-block; opacity: 0; }
  .sub2 { position: absolute; left: 70px; top: 922px; margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 44px; color: #FFE4E1; white-space: pre; text-shadow: 0 4px 24px rgba(30,8,16,0.6); }
  .lnk2 { position: absolute; left: 66px; top: 1010px; margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 78px; letter-spacing: -2px; color: #F7B8C9; opacity: 0; text-shadow: 0 4px 30px rgba(30,8,16,0.6); }
  .caret { display: inline-block; width: 0.55em; height: 0.9em; margin-left: 6px; vertical-align: -0.08em; background: #F7B8C9; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="win" id="win">
    <div class="bar"><i></i><i></i><i></i><div class="url">suhanitiwari.com</div></div>
    <video id="v" src="li-site.mp4" muted playsinline preload="auto"></video>
  </div>
  <h1 id="h"></h1>
  <div class="end" id="cta">
    <img src="tower.jpg" alt="">
    <div class="shade"></div>
    <p class="big" id="motto2"></p>
    <p class="big name" id="name2"></p>
    <p class="mis3" id="mis3"><span>Management</span> <span>Information</span> <span>Systems</span></p>
    <p class="sub2" id="sub2"></p>
    <p class="lnk2" id="lnk2">suhanitiwari.com</p>
  </div>
<script>
  // [start, end] in seconds of the site recording (from tools/record's marks)
  const caps = [
    [0.00, 2.65, '“MIS? So… business and <em>computer science</em>?”'],
    [2.65, 4.31, 'Every MIS major has heard it.'],
    [4.31, 6.00, 'Couldn’t be further from the <em>truth</em>.'],
    [6.00, 7.86, 'It’s about…'],
    [7.86, 10.61, 'finding the problem <em>worth solving</em>,'],
    [10.61, 13.53, 'turning <b class="m">information</b> into answers,'],
    [13.53, 16.16, 'designing the <b class="m">systems</b> behind it,'],
    [16.16, 18.73, 'getting people to <em>choose</em> it,'],
    [18.73, 22.28, '<b class="m">managing</b> it as it grows,'],
    [22.28, 24.53, 'and teaching the <em>next generation</em> to build too.'],
    [24.53, 99.00, 'So I <em>built</em> my answer.']
  ];
  const h = document.getElementById('h');
  h.innerHTML = caps.map(c => `<span class="cap">${c[2]}</span>`).join('');
  const capEls = [...h.querySelectorAll('.cap')];
  const v = document.getElementById('v'), win = document.getElementById('win'), cta = document.getElementById('cta');
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const VSTART = 0.3, SKIP = 0.9;   // SKIP: the blank moment while the site reloads
  const VEND = 27.5, CTA = 3.1;     // the recording's last useful second, then the end card
  window.DUR = VSTART + VEND - SKIP + CTA;
  const loaded = el => new Promise(r => { if (el.readyState >= 2) r(); else el.addEventListener('loadeddata', r, { once: true }); });
  const tw = document.querySelector('.end img');
  window.ready = Promise.all([loaded(v), tw.decode(), document.fonts.ready]);
  const seek = (el, time) => new Promise(r => { if (Math.abs(el.currentTime - time) < 0.001) return r(); el.addEventListener('seeked', () => r(), { once: true }); el.currentTime = time; });
  window.render = t => new Promise(resolve => {
    const vtime = Math.max(0, t - VSTART) + SKIP;
    capEls.forEach((el, i) => {
      const [a, b] = caps[i];
      const k = i === 0 ? Math.min(ease(t / 0.35), 1 - ease((vtime - b + 0.12) / 0.2)) : Math.min(ease((vtime - a) / 0.22), 1 - ease((vtime - b + 0.12) / 0.2));
      el.style.opacity = Math.max(0, k);
      el.style.transform = `translateY(${(1 - Math.max(0, Math.min(1, k))) * 12}px)`;
    });
    const kw = ease(t / 0.4); win.style.opacity = kw;
    const ctaT = VSTART + VEND - SKIP, kc = ease((t - ctaT) / 0.3), et = Math.max(0, t - ctaT);
    cta.style.opacity = kc;
    tw.style.transform = `scale(${1 + et * 0.03})`;   // a slow push-in on the Tower
    // the motto types out huge, glitches, and decodes into my name; then the line types and the link lands
    const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&<>/{}[]=+';
    const rnd = (i, j) => { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
    const tick = Math.floor(et * 24), esc = c => c.replace(/&/g, '&amp;').replace(/</g, '&lt;'), caret = '<span class="caret"></span>';
    const LINES = [['WHAT', ''], ['STARTS', ''], ['HERE', ''], ['CHANGES', 'pk'], ['THE WORLD', 'pk']];
    const total = LINES.reduce((n, l) => n + l[0].length, 0), typed = Math.max(0, Math.min(total, Math.floor((et - 0.1) / 0.62 * total)));
    const g = Math.max(0, Math.min(1, (et - 0.78) / 0.17));
    let left = typed, mh = [], ci = 0;
    LINES.forEach(([str, cls], li) => {
      const part = str.slice(0, Math.max(0, left)); const done = left >= str.length; left -= str.length;
      const shown = [...part].map((ch, i) => ch !== ' ' && rnd(i + li * 30, tick) < g ? GLYPHS[Math.floor(rnd(i + li * 30 + 5, tick) * GLYPHS.length)] : ch).join('');
      const cur = (!done && part.length < str.length && (li === 0 || left + str.length > 0)) ? caret : '';
      if (part.length || li === 0) mh.push(`<span class="${cls}">${esc(shown)}</span>${part.length < str.length && part.length >= 0 && left < 0 && left + str.length >= 0 ? caret : (li === LINES.length - 1 && typed === total && g === 0 && Math.floor(et * 4) % 2 === 0 ? caret : '')}`);
    });
    const mo2 = document.getElementById('motto2');
    mo2.innerHTML = et < 0.1 ? '' : mh.join('\n');
    mo2.style.opacity = 1 - ease((et - 0.88) / 0.1);
    const NAME = 'SUHANI\nTIWARI', d = Math.max(0, Math.min(1, (et - 0.9) / 0.5)), settled = Math.floor(d * NAME.length);
    const nm2 = document.getElementById('name2');
    nm2.textContent = et < 0.9 ? '' : [...NAME].map((c, i) => i < settled || c === '\n' ? c : GLYPHS[Math.floor(rnd(i, tick) * GLYPHS.length)]).join('');
    // the three pink words from the captions fly in and lock into one line, the full name of the major
    [...document.querySelectorAll('#mis3 span')].forEach((w, i) => { const k = ease((et - 1.35 - i * 0.14) / 0.3), from = [[-90, 0], [0, 60], [90, 0]][i];
      w.style.opacity = k; w.style.transform = `translate(${(1 - k) * from[0]}px, ${(1 - k) * from[1]}px)`; });
    const K = 'at McCombs School of Business', kt = Math.max(0, Math.min(K.length, Math.floor((et - 1.85) / 0.35 * K.length)));
    document.getElementById('sub2').innerHTML = esc(K.slice(0, kt)) + (et > 1.85 && kt < K.length ? caret : '');
    const kl = ease((et - 2.1) / 0.3), l2 = document.getElementById('lnk2'); l2.style.opacity = kl; l2.style.transform = `translateY(${(1 - kl) * 24}px)`;
    if (kc > 0) { win.style.opacity = 1 - kc; h.style.opacity = 1 - kc; }
    seek(v, Math.max(SKIP, Math.min(vtime, v.duration - 0.05))).then(resolve);
  });
</script>
</body></html>
